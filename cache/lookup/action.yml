name: Cache Lookup
description: 通过 GitHub Actions cache API 按 cache-key 前缀列举并解析最新 versioned key（只读）。

inputs:
  cache-key:
    description: 缓存 key（API 列举前缀）
    required: true
  api-try-count:
    description: 单次 GitHub API 调用的最多尝试次数（含首次，默认 3 次）
    required: false
    default: "3"

outputs:
  cache-exists:
    description: 存在匹配 cache-key 前缀的版本化 key 时为 true
  cache-key-full:
    description: 解析到的最新完整 cache key（cache-key 输入 + 时间戳后缀；未找到时为空）

runs:
  using: node24
  main: ../../dist/lookup/index.js
  env:
    GITHUB_TOKEN: ${{ github.token }}
